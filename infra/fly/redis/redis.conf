# Fly's private network is IPv6-only; the dual bind keeps the local
# healthcheck (127.0.0.1) working too.
bind :: 0.0.0.0
port 6379

# 6PN is already a private, per-organization network and the app
# publishes no public ports, so there is no untrusted client to protect
# against here. Add `requirepass` (and REDIS_URL credentials) before
# treating this as anything but a POC.
protected-mode no

dir /data
appendonly yes
appendfsync everysec

# The history write queue lives in a Redis Stream: evicting it under
# memory pressure would silently drop pending message writes, so fail
# the write instead and let the queue's retry/dead-letter path handle it.
maxmemory 768mb
maxmemory-policy noeviction
