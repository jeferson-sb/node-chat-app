name: chatme

# Reference architecture: three stateless @chatme/server instances behind
# an Nginx load balancer (Task 4, docs/adr/2026-08-09-horizontal-scaling.md),
# sharing one Redis instance for the room roster and cross-node broadcast,
# one Postgres for accounts (Task 5, docs/adr/2026-08-09-authentication.md),
# and one 3-node ScyllaDB cluster for chat history (Task 2,
# docs/adr/2026-08-11-chat-history-storage.md), written to via a Redis
# Streams queue rather than directly (Task 3,
# docs/adr/2026-08-11-message-queue-persistence.md). See
# docs/architecture.svg for the full picture.
#
# BETTER_AUTH_SECRET must be set before `docker compose up` - it has no
# default (unlike BETTER_AUTH_URL/CLIENT_APP_URL below), and Better Auth
# refuses to boot without a real one. Put it in a root .env file (already
# covered by .gitignore, so it won't get committed) rather than exporting
# it every time:
#   echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" > .env
# Skipping this crashes all three server replicas on startup, which shows
# up as Nginx returning 502 on every request (nothing healthy to proxy
# to) - `docker compose logs server1` is where that actually surfaces.
#
# Usage:
#   docker compose up --build
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/chatme pnpm --filter @chatme/server run db:migrate:auth
#   SCYLLA_CONTACT_POINTS=localhost pnpm --filter @chatme/server run db:migrate:scylla
#   VITE_SOCKET_URL=http://localhost:8080 pnpm --filter @chatme/client run dev   # in another terminal
#
# Runs on Vite's own default port (5173) - `pnpm --filter ... run dev --
# --port` looks like it should override that, but the `--` gets forwarded
# to Vite literally instead of being stripped (a pnpm/--filter quirk), so
# the port flag is silently ignored. Use `pnpm --filter ... exec vite
# --port <n>` instead if you actually need a non-default port (e.g. to
# run two clients side by side).
#
# Both migration commands are one-time (idempotent to re-run) - accounts
# (Better Auth/Postgres) and chat history (Scylla) each need their schema
# created before the app can use them; nothing in the images runs these
# automatically on boot.
#
# Verify the load balancer is actually distributing connections, and that
# users on different nodes can see/message each other, by opening two
# browser tabs on the same room and checking `docker compose logs -f` for
# "new socket connected" lines split across server1/server2/server3.
#
# Verify Scylla's HA story specifically: `docker compose stop scylla2`
# mid-conversation - writes/reads keep working (replication factor 3,
# only one of three nodes down), unlike a single-instance store where
# that would be an outage.
#
# Verify the message queue specifically: `docker compose stop scylla1
# scylla2 scylla3` mid-conversation - live chat keeps working (broadcast
# never touched the queue), sent messages queue up in Redis
# (`redis-cli XLEN chatme:messages:pending`), then bring Scylla back up
# and watch the backlog drain (`XLEN` falling back toward 0) without
# restarting any server replica.

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatme
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  scylla1:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --api-address 0.0.0.0
    ports:
      - '9042:9042'
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla2:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla3:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  server1:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatme-server
    environment: &server-env
      PORT: '8080'
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatme
      SCYLLA_CONTACT_POINTS: scylla1,scylla2,scylla3
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      CLIENT_APP_URL: ${CLIENT_APP_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy

  server2:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  server3:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - server1
      - server2
      - server3
