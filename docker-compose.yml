name: chatme

# Reference architecture for Task 4 in docs/TASK_TRACKER.md: three
# @chatme/server instances behind an Nginx load balancer, sharing room
# state and cross-node broadcast through Redis (RedisRoomRepository +
# the socket.io Redis adapter — see apps/server/src/presentation/createApp.ts).
#
# Usage:
#   docker compose up --build
#   pnpm --filter @chatme/client dev -- --port 5300   # in another terminal
#   VITE_SOCKET_URL=http://localhost:8080 (Nginx), see apps/client/.env.example
#
# Verify the load balancer is actually distributing connections, and that
# users on different nodes can see/message each other, by opening two
# browser tabs on the same room and checking `docker compose logs -f` for
# "new socket connected" lines split across server1/server2/server3.

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Only server1 has a `build` block. server2/server3 reuse the same
  # `chatme-server` image tag it produces — giving all three a `build`
  # block (e.g. via a YAML anchor including it) makes Compose build and
  # tag the same image concurrently in three build contexts, which race
  # on the final `docker tag` and fail with "image ... already exists".
  # `depends_on: server1: condition: service_started` forces server1's
  # build+start to finish first, so the image exists by the time
  # server2/server3 start from it.
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatme-server
    environment: &server-env
      PORT: '8080'
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      CLIENT_APP_URL: ${CLIENT_APP_URL:-http://localhost:5300}
    depends_on:
      redis:
        condition: service_healthy

  server2:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      server1:
        condition: service_started

  server3:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      server1:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - server1
      - server2
      - server3
