name: chatme

# Reference architecture for Task 4 in docs/TASK_TRACKER.md: three
# @chatme/server instances behind an Nginx load balancer, sharing room
# state and cross-node broadcast through Redis (RedisRoomRepository +
# the socket.io Redis adapter — see apps/server/src/presentation/createApp.ts).
# Also a 3-node ScyllaDB cluster for chat history (Task 2, see
# docs/adr/2026-08-11-chat-history-storage.md).
#
# Usage:
#   docker compose up --build
#   SCYLLA_CONTACT_POINTS=localhost pnpm --filter @chatme/server run db:migrate:scylla
#   pnpm --filter @chatme/client dev -- --port 5300   # in another terminal
#   VITE_SOCKET_URL=http://localhost:8080 (Nginx), see apps/client/.env.example
#
# Verify the load balancer is actually distributing connections, and that
# users on different nodes can see/message each other, by opening two
# browser tabs on the same room and checking `docker compose logs -f` for
# "new socket connected" lines split across server1/server2/server3.
#
# Verify Scylla's HA story specifically: `docker compose stop scylla2` mid-
# conversation - writes/reads keep working (replication factor 3, only one
# of three nodes down), unlike a single-instance store where that would be
# an outage.

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Backs Better Auth (accounts are mandatory, see
  # docs/adr/2026-08-09-authentication.md) - see infra/auth/createAuth.ts.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatme
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  # Backs chat history (docs/adr/2026-08-11-chat-history-storage.md) - a
  # 3-node cluster (replication factor 3, set by the migration script)
  # mirroring the app-server replica pattern below, to actually
  # demonstrate leaderless HA/write scaling rather than a single-instance
  # stand-in. --developer-mode relaxes Scylla's production hardware
  # checks (NUMA, disk I/O scheduler) for local dev; --overprovisioned/
  # --smp/--memory cap resource usage since this isn't performance-tuned.
  scylla1:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --api-address 0.0.0.0
    ports:
      - '9042:9042'
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla2:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla3:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Only server1 has a `build` block. server2/server3 reuse the same
  # `chatme-server` image tag it produces — giving all three a `build`
  # block (e.g. via a YAML anchor including it) makes Compose build and
  # tag the same image concurrently in three build contexts, which race
  # on the final `docker tag` and fail with "image ... already exists".
  # `depends_on: server1: condition: service_started` forces server1's
  # build+start to finish first, so the image exists by the time
  # server2/server3 start from it.
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatme-server
    environment: &server-env
      PORT: '8080'
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatme
      SCYLLA_CONTACT_POINTS: scylla1,scylla2,scylla3
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      CLIENT_APP_URL: ${CLIENT_APP_URL:-http://localhost:5300}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy

  server2:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  server3:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - server1
      - server2
      - server3
