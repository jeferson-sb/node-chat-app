name: chatme

# Usage:
#   docker compose up --build
#   SCYLLA_CONTACT_POINTS=localhost pnpm --filter @chatme/server run db:migrate:scylla
#   pnpm --filter @chatme/client dev -- --port 5300   # in another terminal
#   VITE_SOCKET_URL=http://localhost:8080 (Nginx), see apps/client/.env.example
#

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatme
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  scylla1:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --api-address 0.0.0.0
    ports:
      - '9042:9042'
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla2:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scylla3:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --seeds=scylla1
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "SELECT now() FROM system.local"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  server1:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatme-server
    environment: &server-env
      PORT: '8080'
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatme
      SCYLLA_CONTACT_POINTS: scylla1,scylla2,scylla3
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      CLIENT_APP_URL: ${CLIENT_APP_URL:-http://localhost:5300}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy

  server2:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  server3:
    image: chatme-server
    environment: *server-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      server1:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - server1
      - server2
      - server3
