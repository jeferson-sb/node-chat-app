# PostgreSQL - Better Auth accounts and per-user room membership
# (docs/adr/2026-08-09-authentication.md). Unlike Redis and Scylla this
# store has no in-memory fallback: the server fails at startup without
# DATABASE_URL.
#
#   fly deploy infra/fly/postgres --config infra/fly/postgres/fly.toml
#
# This runs the stock postgres image on a Fly volume, which keeps the
# whole POC describable in this repo. For production prefer Fly Managed
# Postgres (`fly mpg create`) - backups, failover and connection pooling
# are not something this file gives you. See infra/fly/README.md.

app = "chatme-postgres"
primary_region = "gru"

[build]
  image = "postgres:17-alpine"

[env]
  POSTGRES_USER = "chatme"
  POSTGRES_DB = "chatme"
  # The volume mounts at /var/lib/postgresql/data, and initdb refuses a
  # non-empty directory (the volume has a lost+found), so the cluster
  # goes in a subdirectory of it.
  PGDATA = "/var/lib/postgresql/data/pgdata"

# Secret set by ../provision.sh: POSTGRES_PASSWORD

[[mounts]]
  source = "chatme_pg_data"
  destination = "/var/lib/postgresql/data"

[[services]]
  internal_port = 5432
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  # Private-only: reachable at chatme-postgres.internal:5432 over 6PN.
  ports = []

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
