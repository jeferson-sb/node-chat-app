worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # See docs/adr/2026-08-09-modernize-stack.md ("Task 4"): the client
  # (apps/client/src/components/Chat.vue) connects with
  # `transports: ["websocket"]` only, skipping Socket.IO's HTTP
  # long-polling handshake. A websocket connection is a single persistent
  # TCP connection, so plain round-robin is safe here — sticky sessions
  # (session affinity) are only needed to keep long-polling's repeated
  # HTTP requests landing on the same node.
  upstream chatme_backend {
    server server1:8080;
    server server2:8080;
    server server3:8080;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://chatme_backend;
      proxy_http_version 1.1;

      # Required for the websocket upgrade handshake to succeed.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Must exceed Socket.IO's pingInterval + pingTimeout (45s by
      # default) or nginx will drop idle-looking connections that are
      # actually still alive, per the Socket.IO docs' load balancing guide.
      proxy_read_timeout 60s;
    }
  }
}
